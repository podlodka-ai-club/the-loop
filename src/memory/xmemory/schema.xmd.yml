xmd_version: v1
title: Loci geolocation memory v1

objects:
  TrainingExperience:
    fields:
      source_attempt_id:
        type: str
        required: true
        enum: null
        default: null
      feature_key:
        type: str
        required: true
        enum: null
        default: null
      memory_hit_id:
        type: str
        required: true
        enum: null
        default: null
      effect:
        type: str
        required: true
        enum: [helped, irrelevant, misleading, insufficient]
        default: null
      idempotency_key:
        type: str
        required: true
        enum: null
        default: null
      lesson_content:
        type: str
        required: true
        enum: null
        default: null
      region:
        type: str
        required: false
        enum: null
        default: null
      observed_triggers_json:
        type: str
        required: true
        enum: null
        default: null
    primary_key: [source_attempt_id, feature_key, memory_hit_id]

  Insight:
    fields:
      statement:
        type: str
        required: true
        enum: null
        default: null
      kind:
        type: str
        required: true
        enum: [positive_evidence, negative_evidence, comparison, caveat, procedure]
        default: null
    primary_key: []

relations:
  derived_from:
    objects:
      experience:
        type: TrainingExperience
        on_delete: cascade
      insight:
        type: Insight
        on_delete: cascade
    keys:
      one_source_per_insight: [insight]
